documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "Cargo.toml"
          - "Cargo.lock"
          - "build.rs"
          - "tauri*.conf.json"
          - "capabilities/**"
          - "assets/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
          - "frontend/package.json"
          - "frontend/package-lock.json"

usb:
  - changed-files:
      - any-glob-to-any-file:
          - "src/usb_accessory/**"
          - "docs/usb-accessory-probe.md"

network:
  - changed-files:
      - any-glob-to-any-file:
          - "src/udp_ingest/**"

input:
  - changed-files:
      - any-glob-to-any-file:
          - "src/input_pipeline/**"
          - "src/native_input/**"
          - "src/shortcut/**"
          - "src/radial_overlay/**"
          - "docs/winapi/**"

windows:
  - changed-files:
      - any-glob-to-any-file:
          - "src/native_input/windows/**"
          - "src/workspace/windows.rs"
          - "docs/winapi/**"
          - "assets/windows/**"

macos:
  - changed-files:
      - any-glob-to-any-file:
          - "src/native_input/macos/**"
          - "src/workspace/macos.rs"

linux:
  - changed-files:
      - any-glob-to-any-file:
          - "src/native_input/linux/**"
          - "src/workspace/linux/**"
          - "tauri.linux.conf.json"
          - ".github/workflows/build-linux.yml"
          - "assets/linux/**"
