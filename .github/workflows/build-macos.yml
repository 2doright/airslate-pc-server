name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build universal macOS package
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build universal macOS packages
        run: >-
          ./frontend/node_modules/.bin/tauri build
          --target universal-apple-darwin
          --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prepare macOS build assets
        run: |
          version="$(node -p "require('./tauri.conf.json').version")"
          mkdir -p release-assets
          dmg_path=$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          app_path=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          cp "$dmg_path" "release-assets/AirSlate-PC-Server_${version}_macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/AirSlate-PC-Server_${version}_macos-universal.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: airslate-macos-universal-release-assets
          path: release-assets/*
          if-no-files-found: error
