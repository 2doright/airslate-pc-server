name: Rename v1.7.0 macOS updater asset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rename-v1.7.0-macos-updater.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename updater asset and refresh manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v1.7.0"
          old_name="AirSlate-PC-Server_1.7.0_macos-universal.app.tar.gz"
          new_name="AirSlate-PC-Server_1.7.0_macos-updater.tar.gz"
          mkdir -p work
          gh release download "$tag" --repo "$REPO" --pattern "$old_name" --dir work
          mv "work/$old_name" "work/$new_name"
          gh release upload "$tag" "work/$new_name" --repo "$REPO" --clobber
          gh release download "$tag" --repo "$REPO" --pattern latest.json --dir work
          jq --arg url "https://github.com/${REPO}/releases/download/${tag}/${new_name}" \
            '.platforms["darwin-x86_64"].url = $url | .platforms["darwin-aarch64"].url = $url' \
            work/latest.json > work/latest.updated.json
          mv work/latest.updated.json work/latest.json
          gh release upload "$tag" work/latest.json --repo "$REPO" --clobber
          gh release delete-asset "$tag" "$old_name" --repo "$REPO" --yes
