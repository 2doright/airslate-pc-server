name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 packages
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $configVersion = (Get-Content 'tauri.conf.json' -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $configVersion) {
            throw "Release tag $tagVersion does not match tauri.conf.json version $configVersion"
          }

      - name: Run Rust tests
        run: cargo test --all-features --locked

      - name: Build signed MSI
        shell: pwsh
        run: |
          $appVersion = [System.Management.Automation.SemanticVersion]::Parse(
            $env:GITHUB_REF_NAME.Substring(1)
          )
          if ($appVersion.PreReleaseLabel) {
            if ($appVersion.PreReleaseLabel -notmatch '^beta\.(?<number>[1-9]\d*)$') {
              throw "MSI prerelease versions must use beta.N: $appVersion"
            }
            $msiBuild = [int]$Matches.number
            if ($msiBuild -gt 65534) {
              throw "MSI beta number must not exceed 65534: $msiBuild"
            }
            $msiVersion = "$($appVersion.Major).$($appVersion.Minor).$($appVersion.Patch).$msiBuild"
          } else {
            $msiVersion = "$($appVersion.Major).$($appVersion.Minor).$($appVersion.Patch)"
          }
          $msiConfig = @{
            bundle = @{
              windows = @{
                wix = @{ version = $msiVersion }
              }
            }
          }
          $msiConfig | ConvertTo-Json -Depth 4 | Set-Content '.tauri.windows-release.json'
          .\frontend\node_modules\.bin\tauri.cmd build `
            --bundles msi `
            --config '.tauri.windows-release.json' `
            --ci

      - name: Build portable executable
        run: .\frontend\node_modules\.bin\tauri.cmd build --no-bundle --features portable --ci

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $msiSource = Get-ChildItem "target/release/bundle/msi/*_${version}_*.msi" | Select-Object -First 1
          $signatureSource = Get-ChildItem "target/release/bundle/msi/*_${version}_*.msi.sig" | Select-Object -First 1
          $portableSource = 'target/release/airslate_pc_server.exe'
          $msiName = "AirSlate-PC-Server_${version}_windows-x64.msi"
          New-Item -ItemType Directory -Path 'release-assets' -Force | Out-Null
          Copy-Item -LiteralPath $msiSource.FullName -Destination "release-assets/$msiName"
          Copy-Item -LiteralPath $signatureSource.FullName -Destination "release-assets/${msiName}.sig"
          Copy-Item -LiteralPath $portableSource -Destination "release-assets/AirSlate-PC-Server_${version}_windows-x64-portable.exe"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: airslate-windows-release-assets
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS universal packages
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          config_version="$(node -p "require('./tauri.conf.json').version")"
          if [ "$tag_version" != "$config_version" ]; then
            echo "Release tag $tag_version does not match tauri.conf.json version $config_version"
            exit 1
          fi

      - name: Run Rust tests
        run: cargo test --all-features --locked

      - name: Build universal macOS packages
        run: >-
          ./frontend/node_modules/.bin/tauri build
          --target universal-apple-darwin
          --bundles app,dmg

      - name: Prepare macOS release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          dmg_path=$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          app_path=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          updater_path=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          updater_sig_path="${updater_path}.sig"
          cp "$dmg_path" "release-assets/AirSlate-PC-Server_${version}_macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/AirSlate-PC-Server_${version}_macos-universal.app.zip"
          cp "$updater_path" "release-assets/AirSlate-PC-Server_${version}_macos-updater.tar.gz"
          cp "$updater_sig_path" "release-assets/AirSlate-PC-Server_${version}_macos-updater.tar.gz.sig"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: airslate-macos-release-assets
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x64 packages
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm patchelf
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          config_version="$(node -p "require('./tauri.conf.json').version")"
          if [ "$tag_version" != "$config_version" ]; then
            echo "Release tag $tag_version does not match tauri.conf.json version $config_version"
            exit 1
          fi

      - name: Run Rust tests
        run: cargo test --all-features --locked

      - name: Build signed Linux packages
        run: ./frontend/node_modules/.bin/tauri build --bundles deb,rpm,appimage --ci

      - name: Prepare Linux release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          deb_path=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          rpm_path=$(find target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)
          appimage_path=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          updater_path=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage.tar.gz' -print -quit)
          updater_sig_path="${updater_path}.sig"
          cp "$deb_path" "release-assets/AirSlate-PC-Server_${version}_linux-amd64.deb"
          cp "$rpm_path" "release-assets/AirSlate-PC-Server_${version}_linux-amd64.rpm"
          cp "$appimage_path" "release-assets/AirSlate-PC-Server_${version}_linux-amd64.AppImage"
          cp "$updater_path" "release-assets/AirSlate-PC-Server_${version}_linux-x86_64.AppImage.tar.gz"
          cp "$updater_sig_path" "release-assets/AirSlate-PC-Server_${version}_linux-x86_64.AppImage.tar.gz.sig"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: airslate-linux-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: airslate-windows-release-assets
          path: release-assets

      - name: Download macOS release assets
        uses: actions/download-artifact@v8
        with:
          name: airslate-macos-release-assets
          path: release-assets

      - name: Download Linux release assets
        uses: actions/download-artifact@v8
        with:
          name: airslate-linux-release-assets
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          release_assets=(
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.app.zip
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.AppImage
            release-assets/*_macos-updater.tar.gz
            release-assets/*_linux-x86_64.AppImage.tar.gz
          )
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            create_notes_args=(--notes-file "$notes_file")
            edit_notes_args=(--notes-file "$notes_file")
          else
            create_notes_args=(--generate-notes)
            edit_notes_args=()
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              "${release_assets[@]}" \
              --clobber
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                "${edit_notes_args[@]}" \
                --prerelease \
                --latest=false
            else
              gh release edit "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                "${edit_notes_args[@]}" \
                --prerelease=false
            fi
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release create "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                "${release_assets[@]}" \
                --title "AirSlate PC Server ${GITHUB_REF_NAME}" \
                "${create_notes_args[@]}" \
                --prerelease \
                --latest=false
            else
              gh release create "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                "${release_assets[@]}" \
                --title "AirSlate PC Server ${GITHUB_REF_NAME}" \
                "${create_notes_args[@]}"
            fi
          fi

      - name: Generate update manifest
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          windows_signature=$(tr -d '\r\n' < release-assets/AirSlate-PC-Server_${version}_windows-x64.msi.sig)
          macos_signature=$(tr -d '\r\n' < release-assets/AirSlate-PC-Server_${version}_macos-updater.tar.gz.sig)
          linux_signature=$(tr -d '\r\n' < release-assets/AirSlate-PC-Server_${version}_linux-x86_64.AppImage.tar.gz.sig)
          notes=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          windows_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AirSlate-PC-Server_${version}_windows-x64.msi"
          macos_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AirSlate-PC-Server_${version}_macos-updater.tar.gz"
          linux_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AirSlate-PC-Server_${version}_linux-x86_64.AppImage.tar.gz"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg windows_signature "$windows_signature" \
            --arg windows_url "$windows_url" \
            --arg macos_signature "$macos_signature" \
            --arg macos_url "$macos_url" \
            --arg linux_signature "$linux_signature" \
            --arg linux_url "$linux_url" \
            '{
              version: $version,
              notes: $notes,
              pub_date: (now | todate),
              platforms: {
                "windows-x86_64": {
                  signature: $windows_signature,
                  url: $windows_url
                },
                "darwin-x86_64": {
                  signature: $macos_signature,
                  url: $macos_url
                },
                "darwin-aarch64": {
                  signature: $macos_signature,
                  url: $macos_url
                },
                "linux-x86_64": {
                  signature: $linux_signature,
                  url: $linux_url
                }
              }
            }' > latest.json

      - name: Publish update manifest release asset
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
